{% set name = "jupyter-ai-tools" %}
{% set version = "0.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-','_') }}-{{ version }}.tar.gz
  sha256: 37423f452072ed1b6eb7bf5ac142a8476d434bb4f6a076c4aa2ebfd9525fe7c0

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling >=1.5
  run:
    - python
    - jupyter_server >=1.6,<3
    - pycrdt
    - jupyter_ydoc >=3.0.0,<4.0.0
  run_constrained:
    - mcp >=1.0

test:
  source_files:
    - tests
  imports:
    - jupyter_ai_tools
  requires:
    - pip
    - pytest >=7.0
    - pytest-asyncio
    - mcp
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vvv tests

about:
  home: https://github.com/jupyter-ai-contrib/jupyter-ai-tools
  summary: A suite of tools for AI agents in Jupyter
  description: |
    jupyter_ai_tools is a Jupyter Server extension that exposes a collection of
    powerful, agent-friendly tools for interacting with notebooks and Git repositories.
    It is designed for use by AI personas (like those in Jupyter AI) to programmatically
    modify notebooks, manage code cells, and interact with version control systems.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/jupyter-ai-contrib/jupyter-ai-tools
  doc_url: https://jupyter-ai.readthedocs.io

extra:
  recipe-maintainers:
    - dlqqq
    - andrii-i
