{% set name = "jupyter-ai-tools" %}
{% set version = "0.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-','_') }}-{{ version }}.tar.gz
  sha256: 37423f452072ed1b6eb7bf5ac142a8476d434bb4f6a076c4aa2ebfd9525fe7c0

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling >=1.5
  run:
    - python
    - jupyter_server >=1.6,<3
    - pycrdt
    - jupyter_ydoc >=3.0.0,<4.0.0

test:
  imports:
    - jupyter_ai_tools
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"

about:
  homepage: https://github.com/jupyter-ai-contrib/jupyter-ai-tools
  summary: "A suite of tools for AI agents in Jupyter"
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://jupyter-ai.readthedocs.io/
  repository: https://github.com/jupyter-ai-contrib/jupyter-ai-tools

extra:
  recipe-maintainers:
    - dlqqq
    - andrii-i
